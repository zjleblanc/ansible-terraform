---
info_list_kvpairs:
  - key: virtual machine name
    value: "{{ inventory_hostname }}"
  - key: ansible host
    value: "{{ ansible_host }}"
  - key: mac address
    value: "{{ mac_address[0] }}"
  - key: public ip addresses
    value: "{{ public_ip_addresses | default([]) | join(',') }}"
  - key: private ip addresses
    value: "{{ private_ip_addresses | default([]) | join(',') }}"
  - key: image
    value: "{{ image['offer'] }} {{ image['sku'] }}:{{ image['version'] }}"
  - key: virtual machine size
    value: "{{ virtual_machine_size }}"
  - key: resource group
    value: "{{ resource_group }}"
  - key: azure region
    value: "{{ location }}"
  - key: tags
    value: "{{ tags | default({}) | dict2items }}"
